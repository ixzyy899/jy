<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08080a">
<meta name="description" content="Portofolio Julian Ikhsan, desainer grafis.">
<title>Julian Ikhsan — Portofolio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#08080a;--panel:#121216;--text:#f5f2f8;--muted:#9994a2;--line:#2a2731;--accent:#b69af5;--display:'Space Grotesk',sans-serif;--body:'DM Sans',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.65}
a{color:inherit;text-decoration:none}
.container{width:min(1120px,calc(100% - 48px));margin-inline:auto}
header{position:sticky;top:0;z-index:10;background:#08080aeF;backdrop-filter:blur(15px);border-bottom:1px solid #ffffff12}
nav{height:74px;display:flex;align-items:center;justify-content:space-between}
.brand{display:inline-flex;width:62px;height:48px;align-items:center;justify-content:center;overflow:hidden}
.brand img{width:100%;height:100%;object-fit:contain}
.nav-links{display:flex;gap:34px;color:#c7c2ce;font-size:.9rem}
.nav-links a:hover,.back-top:hover{color:var(--accent)}
.menu-toggle{display:none;background:none;border:0;color:white;font-size:1.6rem}
.hero{min-height:680px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:48px;padding-block:72px 104px;position:relative}
.eyebrow{font-size:.7rem;letter-spacing:.17em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0}
.dot{display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:50%;margin-right:9px}
h1,h2,h3,p{margin-top:0}
h1{font:600 clamp(3.1rem,6.2vw,5.8rem)/.99 var(--display);letter-spacing:-.075em;margin:22px 0}
.accent{color:var(--accent)}
.hero-copy>p:not(.eyebrow){max-width:490px;color:#aaa5b1;line-height:1.9}
.hero-copy strong{color:var(--text)}
.actions{display:flex;align-items:center;gap:26px;margin-top:32px}
.button{display:inline-flex;align-items:center;gap:22px;background:var(--accent);color:#17121f;padding:13px 18px;font-size:.86rem;font-weight:700;transition:transform .2s}
.button:hover{transform:translateY(-3px)}
.simple-link{font-size:.88rem;color:#cbc6d1}
.simple-link span{color:var(--accent);padding-left:7px}
.hero-visual{height:470px;background:#101014;border:1px solid #302c39;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.hero-visual:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:38px 38px}
.halo{position:absolute;width:80%;aspect-ratio:1;border-radius:50%;top:8%;background:radial-gradient(circle,#39345d,#211d34 55%,transparent 73%)}
.portrait{position:relative;z-index:1;height:108%;max-width:112%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 10px 25px #0009)}
.mindset-logo{position:absolute;z-index:2;top:17px;left:17px;width:230px;height:125px;padding:5px;background:#08080a;border:1px solid #494354;display:grid;place-items:center}
.mindset-logo img{width:100%;height:100%;object-fit:contain}
.mindset-label{position:absolute;z-index:2;right:16px;bottom:16px;padding:8px 11px;background:#08080add;border:1px solid #ffffff25;font-size:.62rem;letter-spacing:.15em}
.hero-bottom{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:space-between;gap:16px;color:#77717f;font-size:.61rem;letter-spacing:.12em}
.section{padding:112px 0;border-top:1px solid var(--line)}
.two-col{display:grid;grid-template-columns:.85fr 1.15fr;gap:85px}
h2{font:600 clamp(2.8rem,5vw,4.7rem)/1.02 var(--display);letter-spacing:-.07em;margin:16px 0}
.muted{color:#77717f}
.about-content{padding-top:35px}
.lead{font:500 clamp(1.4rem,2.3vw,2rem)/1.38 var(--display);letter-spacing:-.04em;max-width:650px}
.copy{color:#9c97a3;line-height:1.9;font-size:.93rem;max-width:640px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:38px;padding-top:20px;border-top:1px solid var(--line)}
.fact{font-size:.78rem;color:#c7c2ce}
.fact b{display:block;color:var(--accent);font:600 .8rem var(--display);margin-bottom:7px}
.skills-section{background:#101014;border-block:1px solid var(--line)}
.skills-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:45px}
.skill{min-height:220px;padding:21px;background:#15151a;border:1px solid #302d37;transition:transform .2s,border-color .2s}
.skill:hover{transform:translateY(-4px);border-color:#8772aa}
.num{font-size:.7rem;color:#77717f}
.symbol{font:500 2.1rem var(--display);color:var(--accent);margin:23px 0 11px}
.skill h3{font:600 1rem var(--display);margin-bottom:8px}
.skill p{font-size:.78rem;line-height:1.75;color:#96909e;margin:0}
.note{font-size:.72rem;margin-top:18px}
.gallery-head{display:flex;align-items:end;justify-content:space-between;gap:35px}
.gallery-head .copy{max-width:350px;margin-bottom:22px}
.gallery-card{max-width:760px;margin-top:40px}
.project-frame{background:#121216;border:1px solid #302d37;overflow:hidden;line-height:0}
.project-frame img{display:block;width:100%;height:auto}
.project-meta{display:flex;justify-content:space-between;align-items:start;padding:16px 2px}
.project-meta h3{font:600 1rem var(--display);margin:0 0 4px}
.project-meta p{font-size:.75rem;color:#8e8996;margin:0}
.project-number{font-size:.75rem;color:var(--accent)}
footer{min-height:104px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}
footer p,footer>a:last-child{font-size:.73rem;color:#77717f;margin:0}
@media(max-width:820px){.hero{grid-template-columns:1fr;gap:32px;padding-top:65px}.hero-visual{height:430px}.two-col{grid-template-columns:1fr;gap:12px}.about-content{padding-top:5px}.skills-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
 .container{width:calc(100% - 36px)}nav{height:66px}.brand{width:56px;height:43px}
 .menu-toggle{display:block;cursor:pointer}
 .nav-links{display:none;position:absolute;top:66px;left:0;right:0;padding:20px 22px;background:#101014;border-bottom:1px solid var(--line);flex-direction:column;gap:18px}
 .nav-links.open{display:flex}
 .hero{padding-top:55px;padding-bottom:88px;min-height:auto}
 h1{font-size:clamp(3rem,12.5vw,4.4rem)}
 .hero-visual{height:350px}.mindset-logo{width:185px;height:100px}.hero-bottom{font-size:.48rem}
 .section{padding:82px 0}h2{font-size:clamp(2.7rem,10.5vw,3.6rem)}
 .facts{grid-template-columns:1fr;gap:13px}
 .skills-grid{gap:9px}.skill{padding:15px;min-height:205px}.skill h3{font-size:.9rem}.skill p{font-size:.72rem}
 .gallery-head{display:block}.gallery-head .copy{margin-top:16px}
 footer{padding:18px 0;flex-wrap:wrap}footer p{order:3;width:100%}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
</style>
</head>
